{{- if and .Values.spanner.enabled .Values.spanner.iam.serviceAccount }}
# Runtime data-plane access: the main container reads/writes Spanner data.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ printf "%s-spanner-user" (include "platform-api-server.fullname" .) }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ required "spanner.projectId is required when spanner is enabled" .Values.spanner.projectId | quote }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  member: {{ printf "serviceAccount:%s" .Values.spanner.iam.serviceAccount }}
  role: {{ .Values.spanner.iam.role }}
  resourceRef:
    kind: SpannerDatabase
    name: {{ .Values.spanner.databaseId }}
---
# DDL admin access: the init container creates tables, indexes, and change
# streams at startup. This requires GetDatabaseDdl and UpdateDatabaseDdl
# permissions that are only in roles/spanner.databaseAdmin, not databaseUser.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ printf "%s-spanner-admin" (include "platform-api-server.fullname" .) }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ .Values.spanner.projectId | quote }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  member: {{ printf "serviceAccount:%s" .Values.spanner.iam.serviceAccount }}
  role: {{ .Values.spanner.iam.migrationRole }}
  resourceRef:
    kind: SpannerDatabase
    name: {{ .Values.spanner.databaseId }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ printf "%s-spanner-metric-writer" (include "platform-api-server.fullname" .) }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ .Values.spanner.projectId | quote }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
spec:
  # The Spanner client library emits client-side metrics directly to Cloud
  # Monitoring in the Spanner project, bypassing the SpannerDatabase IAM
  # policy above. The pod's service account needs roles/monitoring.metricWriter
  # on the project to write these metrics.
  # https://cloud.google.com/spanner/docs/view-manage-client-side-metrics#access-client-side-metrics
  member: {{ printf "serviceAccount:%s" .Values.spanner.iam.serviceAccount }}
  role: roles/monitoring.metricWriter
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: {{ printf "projects/%s" .Values.spanner.projectId | quote }}
{{- end }}
