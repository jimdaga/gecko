{{- if .Values.spanner.enabled }}
# ArgoCD PreSync hook: runs DDL migrations once before the Deployment is
# applied, so the platform-api-server never needs database admin privileges.
# The Job uses roles/spanner.databaseAdmin to create tables, indexes, and
# change streams; the long-running Deployment uses only databaseUser.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-api-server.fullname" . }}-migrate
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform-api-server.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-api-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --migrate-only
          env:
            - name: SPANNER_DATABASE
              value: {{ printf "projects/%s/instances/%s/databases/%s" .Values.spanner.projectId .Values.spanner.instanceId .Values.spanner.databaseId | quote }}
            {{- if .Values.spanner.tablePrefix }}
            - name: SPANNER_TABLE_PREFIX
              value: {{ .Values.spanner.tablePrefix | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
