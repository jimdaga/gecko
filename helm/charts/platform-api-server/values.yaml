replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-platform-api-server
  tag: "365ddef"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

apiService:
  group: gcp.managed.openshift.io
  version: v1
  groupPriorityMinimum: 1000
  versionPriority: 15

tls:
  port: 8443
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer

publicApi:
  enabled: true
  port: 8081

corsOrigins: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podDisruptionBudget:
  enabled: true
  minAvailable: 1

revisionHistoryLimit: 10
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []

gateway:
  enabled: true
  name: platform-external-gateway
  namespace: platform-gateway
  hostname: ""
  projectId: ""
  service:
    name: platform-api-gateway-svc
    port: 8081
  healthCheck:
    requestPath: /livez
    type: HTTP
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  certificate:
    enabled: true
    name: platform-api-cert
    certificateMap:
      name: platform-gateway-certmap
  # Cloud Armor: deploys a ComputeSecurityPolicy (WAF + rate limiting)
  # and a GCPBackendPolicy that binds it to the gateway service.
  cloudArmor:
    enabled: false
    # WAF sensitivity levels (1-4). Level 1 = highest confidence, fewest false
    # positives. Level 4 = maximum detection, most false positives. All rules
    # default to 1 because JSON API payloads contain URLs, email addresses, and
    # path-like strings that trigger false positives at higher sensitivities.
    wafSensitivity:
      sqli: 1
      xss: 1
      rfi: 1
      lfi: 1
      rce: 1
      scannerdetection: 1
    rateLimit:
      requestsPerMinute: 100
      banRequestsPerMinute: 500
      banDurationSec: 300

# ESPv2 sidecar for Cloud Endpoints integration.
# Requires the pod's service account to have roles/servicemanagement.serviceController
# on the GCP project that owns the Cloud Endpoints service (serviceName).
# Configure Workload Identity via serviceAccount.annotations to bind the KSA to a GSA
# with the required IAM role.
esp:
  enabled: true
  image: gcr.io/endpoints-release/endpoints-runtime:2.55.7
  port: 9080
  serviceName: ""

alloydb:
  enabled: false
  projectId: ""
  location: "us-central1"
  host: ""
  networkRef: "default"
  databaseVersion: "POSTGRES_15"
  cpuCount: 2
  auth:
    username: "orlop"
    password: ""
    existingSecret: ""
  database: "orlop"
  sslMode: "require"

# Google Cloud Spanner backend via Config Connector (CNRM).
# The Spanner instance is shared infrastructure provisioned by the region
# Terraform module (gcp-hcp-infra), named ${project_id}-spanner. This chart
# only creates a KCC SpannerDatabase inside that preexisting instance and
# configures the deployment with the SPANNER_DATABASE env var.
# Requires the Config Connector (cnrm.cloud.google.com) operator to be
# installed in the cluster and the pod's service account to be bound to a
# GCP service account via Workload Identity.
#
# IAM separation: an init container runs DDL migrations with
# roles/spanner.databaseAdmin (GetDatabaseDdl, UpdateDatabaseDdl), then the
# main container starts with only roles/spanner.databaseUser for data-plane
# operations. This follows the principle of least privilege.
spanner:
  enabled: false
  projectId: ""
  instanceId: ""
  databaseId: "gecko"
  # Optional prefix for Spanner table names (e.g. "myapp_" creates
  # "myapp_counters", "myapp_resources"). Must match between the migration
  # Job and Deployment. Leave empty for no prefix.
  tablePrefix: ""
  # IAM grants on the SpannerDatabase created by this chart. When serviceAccount
  # (the GCP service account email bound to the pod's Kubernetes service
  # account via Workload Identity) is set, IAMPolicyMember resources grant it
  # the roles below on the database. Leave serviceAccount empty to skip the
  # grants (e.g. when IAM is managed outside this chart).
  #
  # Two roles are granted:
  #   role          - data-plane access for the main container (read/write)
  #   migrationRole - DDL admin access for the init container (schema setup)
  iam:
    serviceAccount: ""
    role: "roles/spanner.databaseUser"
    migrationRole: "roles/spanner.databaseAdmin"
